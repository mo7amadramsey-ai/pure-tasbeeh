name: Build APK
on:
  push:
  workflow_dispatch:
# صلاحية الكتابة مطلوبة لنشر الإصدار (Release) برابط تحميل مباشر
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: 8.7 }
      - run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: pure-tasbeeh-debug-apk
          path: app/build/outputs/apk/debug/*.apk
      # نشر آخر APK على صفحة Releases برابط مباشر ثابت (يعمل من الهاتف بلا تسجيل دخول)
      - name: Publish latest APK
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/*.apk pure-tasbeeh.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest pure-tasbeeh.apk --prerelease \
            --title "Pure Tasbeeh - آخر نسخة تجريبية" \
            --notes "نسخة debug تُبنى تلقائياً مع كل تحديث. commit: ${GITHUB_SHA::7}"
